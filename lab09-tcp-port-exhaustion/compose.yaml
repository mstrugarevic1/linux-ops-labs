services:
  server:
    image: python:3.12-slim
    command: ["python", "/app/app.py", "server"]
    working_dir: /app
    mem_limit: 96m
    pids_limit: 64
    ports:
      - "8009:8000"
    volumes:
      - ./app.py:/app/app.py:ro
  client:
    image: python:3.12-slim
    command: ["python", "/app/app.py", "client"]
    working_dir: /app
    depends_on:
      - server
    mem_limit: 96m
    pids_limit: 64
    volumes:
      - ./app.py:/app/app.py:ro
